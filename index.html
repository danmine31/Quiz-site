<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Викторины на различные темы</title>
  <link rel="stylesheet" href="styles/index.css"/>
  <link rel="stylesheet" href="styles/styles.css"/>
  <link rel="stylesheet" href="styles/fonts.css"/>
</head>
<body>
  <header class="header">
    <div class="logo">
      <img class="header_logo" src="./assets/images/logo-dark.svg"/>
      <img class="header_logo" src="./assets/images/logo.svg"/>
    </div>
    <button class="header_button">
      <img src="./assets/images/icon-sun.svg"/>
      <img src="./assets/images/icon-moon.svg"/>
    </button>
  </header>
  <main>
    <div class="filter">
      <p class="title">ТЕМАТИЧЕСКИЕ ВИКТОРИНЫ</p>
      <div>
        <button class="filter_button is-active" data-target="all">Все</button>
        <button class="filter_button" data-target="active">Пройденные</button>
        <button class="filter_button" data-target="inactive">Непройденные</button>
      </div>
    </div>
    <p class="status" hidden></p>
    <div class="grid"></div>

    <template id="quiz-card-template">
      <article class="child">
        <div class="grid_svg">
          <img class="svg" src=""/>
          <div class="grid_texts">
            <span class="grid_title"></span>
            <span class="grid_text"></span>
          </div>
        </div>
        <button class="start_button">Пройти</button>
      </article>
    </template>
  </main>
  <script src="scripts/script.js"></script>
</body>
</html>
